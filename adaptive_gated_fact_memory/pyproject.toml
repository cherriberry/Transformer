[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-gated-fact-memory"
version = "0.1.0"
description = "Research prototype for sink-SWA plus adaptive episodic fact memory"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
